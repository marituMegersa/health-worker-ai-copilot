version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: prod_postgres_db
    environment:
      POSTGRES_DB: app_production
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: production_password_123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: prod_redis_cache
    ports:
      - "6379:6379"

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: prod_fastapi_backend
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://postgres:production_password_123@db:5432/app_production
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: prod_react_frontend
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  postgres_data:
