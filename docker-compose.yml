version: '3.8'

services:
  backend-api:
    build: ./apps/api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://copilot_user:copilot_secure_password@postgres:5432/clinical_triage_db

  frontend-web:
    build: ./apps/web
    ports:
      - "5173:5173"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clinical_triage_db
      POSTGRES_USER: copilot_user
      POSTGRES_PASSWORD: copilot_secure_password
    ports:
      - "5432:5432"
